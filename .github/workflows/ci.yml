name: CI

on:
  pull_request:
  push:
    branches: [master]

# Proves a change before Vercel ships it: types, lint, unit tests, a
# production build against the live portfolio API, the smoke test of
# everything robots and agents read (scripts/smoke.mjs), and a browser check
# that the desktop at `/` still works for people (scripts/desktop-check.mjs).
env:
  NEXT_PUBLIC_PORTFOLIO_API_URL: ${{ vars.PORTFOLIO_API_URL || 'https://prod-behind-azsh-424i.encr.app' }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - name: Start the production build
        run: |
          npm start -- -p 3000 > /tmp/next.log 2>&1 &
          echo "NEXT_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/robots.txt && break; sleep 1; done
      - run: npm run smoke -- http://localhost:3000
      - run: npm run desktop-check -- http://localhost:3000
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Stop the server
        if: always()
        run: kill "$NEXT_PID" 2>/dev/null || true; tail -n 50 /tmp/next.log || true

  # Both lockfiles are committed and Vercel installs with one of them (see
  # AGENTS.md). This proves the pnpm tree builds too, so CI covers whichever
  # one production uses.
  pnpm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
